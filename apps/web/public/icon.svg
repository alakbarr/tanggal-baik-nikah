<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="obsidianGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#161920" />
      <stop offset="100%" stop-color="#0B0C0F" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF9F5" />
      <stop offset="50%" stop-color="#DEC071" />
      <stop offset="100%" stop-color="#937A2C" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#DEC071" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Medallion -->
  <circle cx="256" cy="256" r="240" fill="url(#obsidianGrad)" stroke="#DEC071" stroke-width="4" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="224" fill="none" stroke="#DEC071" stroke-width="2" stroke-dasharray="6,4" stroke-opacity="0.3" />

  <!-- Crescent Moon Symbolizing Islamic Lunar Falak -->
  <path d="M 290 140 A 130 130 0 1 0 370 340 A 110 110 0 1 1 290 140 Z" fill="url(#goldGrad)" filter="url(#goldGlow)" />

  <!-- 8-Pointed Star Symbolizing Surya Majapahit / Javanese Petungan -->
  <polygon points="
    310,180 322,212 355,200 335,228 358,252 325,250 322,284 300,258 276,282 284,248 252,242 280,222 265,192 295,208
  " fill="#FAF9F5" />

  <!-- Heart / Harmony central seed node -->
  <circle cx="310" cy="235" r="5" fill="#DEC071" />
</svg>
